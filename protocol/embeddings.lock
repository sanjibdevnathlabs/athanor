# Qdrant collection contract for athanor's vector layer.
#
# athanor does NOT pin the embedding model. SocratiCode owns embedding: it uses
# one configured model for BOTH indexing and querying, so index/query consistency
# is guaranteed by construction. Recording a model name here would be a redundant
# second source of truth that drifts and fires false "model not found" warnings.
#
# If you change SocratiCode's embedding model, re-index all artifacts via
# codebase_context_index — existing vectors are model-specific and incompatible.

qdrant_collection_version: v1
